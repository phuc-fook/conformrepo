configuration_version: "0.1"
repository: {root: repo, include_roots: [specs], exclude_roots: [], suffixes: [.md, .yaml], case_policy: lexical-sensitive}
required_paths: ['specs\sensor.yaml']
reference_bindings: [{id: markdown-links, select: "**/*.md", extractor: markdown-link, relative_mode: document-relative}]
report: {destination: stdout, format: json}
exit_policy: {fail_on: [error]}
